minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: js-yaml@5.4.1
  - js-yaml@5.4.1

allowBuilds:
  # Keep pnpm 10 behavior: esbuild ships prebuilt platform binaries.
  esbuild: false
